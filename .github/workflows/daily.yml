name: 每日 AI 日报

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00，生成并发布当日日报
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空为今天）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-daily:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 采集、生成日报、校验、建索引、出 Feed
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            npm run ingest -- --date "${{ github.event.inputs.date }}"
            npm run issue:build -- --date "${{ github.event.inputs.date }}"
          else
            npm run ingest
            npm run issue:build
          fi
          npm run validate
          npm run index
          npm run feeds

      - name: 提交日报数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content public
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交。"
          else
            git commit -m "chore(daily): 更新每日 AI 日报数据"
            git push
          fi
